name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci:
    name: Type Check & Build
    runs-on: ubuntu-latest

    # ── Services: PostgreSQL & Redis (tanpa koneksi server luar) ──
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fp_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fp_test_db
      REDIS_URL: redis://localhost:6379
      PORT: 8000
      JWT_SECRET: ci-jwt-secret-dummy
      JWT_SECRET_VERIFY_EMAIL: ci-jwt-verify-dummy
      JWT_SECRET_RESET_PASSWORD: ci-jwt-reset-dummy
      BASE_URL_FE: http://localhost:3000
      GMAIL_EMAIL: dummy@example.com
      GMAIL_APP_PASSWORD: dummy
      CLOUDINARY_CLOUD_NAME: dummy
      CLOUDINARY_API_KEY: dummy
      CLOUDINARY_API_SECRET: dummy
      XENDIT_SECRET_API_KEY: dummy
      XENDIT_CALLBACK_TOKEN: dummy

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run database migrations
        run: npx prisma migrate deploy

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Build application
        run: npm run build

      - name: Verify build output exists
        run: |
          echo "✅ Build output:"
          ls -la dist/